<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Grant Truesdell — The Hockey Lab</title>
  <meta name="description" content="Grant Truesdell · Founder & Head Coach · The Hockey Lab · Goalie Development · Coquitlam, BC">
  <!-- Prevent indexing — this is a personal card page -->
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #FFD700;
      --dark: #0a0a0a;
      --dark2: #111111;
      --dark3: #181818;
      --white60: rgba(255,255,255,0.6);
      --white20: rgba(255,255,255,0.12);
    }
    html, body {
      min-height: 100%;
      background: var(--dark);
      color: #fff;
      font-family: 'Exo 2', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 32px 20px 48px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── BACKGROUND GLOW ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(255,215,0,0.06) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── CARD ── */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: var(--dark2);
      border: 1px solid rgba(255,255,255,0.08);
      border-top: 3px solid var(--gold);
      padding: 40px 28px 32px;
      text-align: center;
    }

    /* ── LOGO MARK ── */
    .logo-mark {
      display: inline-block;
      margin-bottom: 28px;
    }
    .logo-mark .top {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px; font-weight: 700;
      letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }
    .logo-mark .bottom {
      font-family: 'Exo 2', sans-serif;
      font-weight: 900; font-size: 38px;
      text-transform: uppercase; letter-spacing: 2px;
      color: var(--gold); line-height: 1;
    }

    /* ── AVATAR RING ── */
    .avatar-wrap {
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      padding: 3px;
      margin: 0 auto 20px;
      background: var(--dark3);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .avatar-wrap img {
      width: 100%; height: 100%;
      border-radius: 50%; object-fit: cover; object-position: top;
    }
    .avatar-initials {
      font-weight: 900; font-size: 36px;
      color: var(--gold); letter-spacing: -1px;
    }

    /* ── NAME / TITLE ── */
    .name {
      font-weight: 900; font-size: 28px;
      text-transform: uppercase; letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 6px;
    }
    .org {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 28px;
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px; background: rgba(255,255,255,0.08);
      margin: 0 0 28px;
    }

    /* ── ACTION BUTTONS ── */
    .actions {
      display: flex; flex-direction: column; gap: 10px;
      margin-bottom: 24px;
    }
    .btn {
      display: flex; align-items: center;
      gap: 14px;
      padding: 16px 20px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      text-decoration: none;
      transition: background 0.18s, border-color 0.18s, transform 0.15s;
      cursor: pointer;
      border: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn-icon {
      width: 36px; height: 36px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 0;
    }
    .btn-label { flex: 1; text-align: left; }
    .btn-arrow {
      font-size: 16px; color: rgba(255,255,255,0.3);
      flex-shrink: 0;
    }

    /* Save Contact — gold primary */
    .btn-save {
      background: var(--gold); color: #000;
    }
    .btn-save .btn-icon { background: rgba(0,0,0,0.15); }
    .btn-save .btn-arrow { color: rgba(0,0,0,0.4); }
    .btn-save:hover { background: #e6c200; }

    /* Secondary buttons */
    .btn-secondary {
      background: var(--dark3);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
    }
    .btn-secondary .btn-icon {
      background: rgba(255,255,255,0.06);
    }
    .btn-secondary:hover {
      border-color: rgba(255,215,0,0.4);
      background: rgba(255,215,0,0.05);
    }

    /* ── SECONDARY LINKS ROW ── */
    .links-row {
      display: flex; gap: 10px;
    }
    .links-row .btn {
      flex: 1; justify-content: center;
      padding: 13px 10px;
      gap: 8px;
    }
    .links-row .btn-label { text-align: center; font-size: 12px; }

    /* ── FOOTER ── */
    .card-footer {
      margin-top: 24px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      text-align: center;
    }
    .card-footer a { color: rgba(255,215,0,0.4); text-decoration: none; }

    /* ── SAVE FEEDBACK ── */
    .save-feedback {
      display: none;
      margin-top: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold); text-align: center;
    }
  </style>
</head>
