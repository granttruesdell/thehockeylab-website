[build]
  publish = "."
  functions = "netlify/functions"

# Google review link. Kept here so it can be updated in one place if Google
# ever changes the URL: every email, QR code and printed card points at /review.
[[redirects]]
  from = "/review"
  to = "https://www.google.com/maps/place//data=!4m3!3m2!1s0x24c20bb29c6a93d9:0x6afe3bf137553f51!12e1?source=g.page.m._&laa=merchant-review-solicitation"
  status = 302
  force = true

[[redirects]]
  from = "/reviews"
  to = "/review"
  status = 302

[[redirects]]
  from = "/pack"
  to = "/claim-lab-pack.html"
  status = 200

[[redirects]]
  from = "/tickets"
  to = "/claim-express-tickets.html"
  status = 200

# The combined two-prize page was replaced when the prizes were split across
# two baskets. Kept as a redirect in case the old link was shared anywhere.
[[redirects]]
  from = "/redeem"
  to = "/pack"
  status = 302

[[redirects]]
  from = "/win"
  to = "/pack"
  status = 302

[[redirects]]
  from = "/waitlist"
  to = "/waitlist.html"
  status = 200

[[redirects]]
  from = "/programs"
  to = "/train.html"
  status = 301

[[redirects]]
  from = "/train"
  to = "/train.html"
  status = 200

[[redirects]]
  from = "/get-started"
  to = "/get-started.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 200

[[redirects]]
  from = "/method"
  to = "/method.html"
  status = 200

[[redirects]]
  from = "/mental-edge"
  to = "/mental-edge.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[[redirects]]
  from = "/meet-grant"
  to = "/meet-grant.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
